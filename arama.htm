<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İsmail Hakkı GÜLER - Kişisel Web Sayfası - Arama Sonuçları</title>
  <style>
    :root {
      --bg: #f9fbfd;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #4f46e5;
      --shadow: 0 8px 24px rgba(0,0,0,.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto;
      background: linear-gradient(135deg, #f8fbff 0%, #eef5ff 100%);
      color: var(--text);
    }

    .container {
      max-width: 1000px;
      margin: 48px auto;
      padding: 0 20px;
    }

   
    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid #e6e9f0;
      overflow: hidden;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #eef1f5;
      margin-bottom: 12px;
    }

    h1 {
      font-size: 28px;
      margin: 0;
      font-weight: 700;
    }

    .sub {
      color: var(--muted);
      font-size: 14px;
    }

   
    #results {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }

    .result {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      transition: transform .2s ease, background .2s;
    }

    .result:hover {
      transform: translateY(-2px);
      background: #f8fbff;
    }

    .result a {
      color: var(--accent);
      text-decoration: none;
      font-size: 16px;
      font-weight: 700;
    }

    .snippet {
      color: var(--muted);
      font-size: 13px;
      margin-top: 6px;
    }

    #noResults {
      color: var(--muted);
      padding: 12px;
    }

   
    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 12px 0 0;
    }

    .btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      text-decoration: none;
    }

    @media (max-width: 700px) {
      h1 { font-size: 24px; }
      #results { grid-template-columns: 1fr; }
    }
  </style>

  <script> document.addEventListener('DOMContentLoaded', function () { document.addEventListener('keydown', function (e) { if (e.key === 'Backspace' || e.keyCode === 8) { const active = document.activeElement; const inInput = active && ( active.tagName === 'INPUT' || active.tagName === 'TEXTAREA' || active.isContentEditable ); if (!inInput && history.length > 1) { e.preventDefault(); history.back(); } } }); }); </script>


</head>
<body>
  <div class="container">
    <div class="card" id="resultsContainer" aria-label="Arama Sonuçları">
      <div class="card-header">
        <h1>İsmail Hakkı GÜLER - Kişisel Web Sitesi</h1>
        <span class="sub">Arama Sonuçları</span>
      </div>

      <div id="results"></div>
      <div id="noResults" style="display:none;">Arama sonucu bulunamadı.</div>
    </div>

    <div class="toolbar" aria-label="Navigation">
      <button type="button" class="btn" onclick="history.back();" aria-label="Geri">Geri Git</button>
    </div>
  </div>

  <script>
    function getQueryParam(name) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(name) || "";
    }

    const pages = [
      { url: "in1hakkimda.htm", title: "Hakkımda", snippet: "Kişisel bilgiler ve özgeçmiş." },
      { url: "in2projeler.htm", title: "Projeler", snippet: "Gerçekleştirdiğim projeler ve çalışmalar." },
      { url: "in3blog.htm", title: "Blog", snippet: "Güncel yazılar ve makaleler." },
      { url: "in4download.htm", title: "Download", snippet: "İndirme bağlantıları ve paketler." },
      { url: "in8linkler.htm", title: "Linkler", snippet: "Favori site adresleri." },
      { url: "in5iletisim.htm", title: "İletişim", snippet: "İletişim formu ve iletişim bilgilerim." },
      { url: "in7ingilizce.htm", title: "İngilizce İçerikler", snippet: "Web sitemin İngilizce içeriği." },
      { url: "in9sitemap.htm", title: "Site Haritası", snippet: "Site yapısı ve bağlantılar." },
      { url: "in6gizlilik.htm", title: "Gizlilik Politikası", snippet: "Gizlilik ve kullanım koşulları." }
    ];

    function renderResults(query) {
      const q = query.trim().toLowerCase();
      const resultsEl = document.getElementById("results");
      resultsEl.innerHTML = "";

      if (!q) {
        document.getElementById("noResults").style.display = "block";
        return;
      } else {
        document.getElementById("noResults").style.display = "none";
      }

      const matched = pages.filter(p =>
        p.title.toLowerCase().includes(q) ||
        p.snippet.toLowerCase().includes(q)
      );

      if (matched.length === 0) {
        document.getElementById("noResults").style.display = "block";
        return;
      }

      matched.forEach(p => {
        const item = document.createElement('div');
        item.className = 'result';
        item.innerHTML = `
          <a href="${p.url}" title="${p.title}">${p.title}</a>
          <div class="snippet">${p.snippet}</div>
        `;
        resultsEl.appendChild(item);
      });
    }

    const queryFromUrl = getQueryParam('q');
    renderResults(queryFromUrl);
  </script>
</body>
</html>
