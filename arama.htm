<!DOCTYPE html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>İsmail Hakkı GÜLER.com - Kişisel Web Sayfası - Site İçi Arama Sonuçları</title>
<style>
:root {
  --bg: silver;
  --card: white;
  --text: #2f3538;
  --muted: #6c7a82;
  --accent: #8eb7cb;
  --shadow-3d: 0 12px 28px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04);
  --card-shadow: 0 20px 40px rgba(117, 130, 138, 0.12);
  --radius: 60px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { 
  margin: 0; 
  font-family: system-ui, -apple-system, "Segoe UI", Roboto; 
  background: linear-gradient(145deg, #f4f6f7 0%, var(--bg) 100%); 
  color: var(--text); 
  perspective: 1000px;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

.container { 
  width: 100%;
  max-width: 650px; 
  margin: 50px auto; 
  padding: 0 20px; 
  text-align: center; 
}

.logo-area {
  width: 90px;
  height: 90px;
  background: #ffffff;
  border: 13px solid var(--accent);
  border-radius: 50%;
  margin: 0 auto 15px auto;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-3d);
  font-weight: bold;
  color: var(--muted);
  font-size: 24px;
}
.logo-area img {
  width: 130%;
  height: 130%;
  object-fit: cover;
  border-radius: 70%;
}
.card { 
  background: var(--card); 
  border-radius: var(--radius); 
  padding: 30px; 
  box-shadow: var(--card-shadow); 
  border: 1px solid silver; 
  overflow: hidden;
}
.card-header { 
  padding-bottom: 20px; 
  border-bottom: 2px solid #e1e6e8; 
  margin-bottom: 24px; 
}
h1 { 
  font-size: 26px; 
  margin: 0 0 6px 0; 
  font-weight: 800; 
  color: var(--text); 
  letter-spacing: -0.5px; 
}
.sub { 
  color: var(--muted); 
  font-size: 14px; 
  font-weight: 600; 
}

#results { 
  display: flex;
  flex-direction: column;
  gap: 16px; 
}
.result { 
  background: #ffffff; 
  border: 6px solid #e1e6e8; 
  border-radius: 12px; 
  padding: 16px; 
  text-align: center; 
  transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1), box-shadow 0.3s ease, border-color 0.3s ease;
  box-shadow: 0 4px 6px rgba(0,0,0,0.01);
}
.result:hover { 
  transform: translateY(-4px) translateZ(5px); 
  border-color: var(--accent);
  box-shadow: var(--shadow-3d);
}
.result a { 
  color: var(--accent); 
  text-decoration: none; 
  font-size: 17px; 
  font-weight: 700; 
  transition: color 0.2s ease;
  display: inline-block;
}
.result:hover a {
  color: #6fa0b9; 
}
.snippet { 
  color: var(--muted); 
  font-size: 13px; 
  margin-top: 6px; 
  line-height: 1.5; 
}
#noResults { 
  color: var(--muted); 
  padding: 20px; 
  background: #f8f9fa; 
  border-radius: 8px; 
  border: 4px dashed #d1d8dc; 
}
.toolbar { 
  display: flex; 
  justify-content: center; 
  padding: 24px 0 0; 
}
.btn { 
  background: #ffffff; 
  border: 2px solid var(--accent); 
  color: var(--text); 
  padding: 10px 28px; 
  border-radius: 10px; 
  cursor: pointer; 
  font-weight: 700; 
  text-decoration: none; 
  box-shadow: 0 4px 0 var(--accent); 
  transition: all 0.1s ease;
  position: relative;
  top: 0;
}
.btn:active {
  top: 4px;
  box-shadow: 0 0px 0 var(--accent);
}
.btn:hover {
  background: #fbfcfd;
}
@media (max-width: 500px) { 
  h1 { font-size: 22px; } 
  .container { margin: 20px auto; padding: 0 15px; }
}
</style>
</head>
<body>

<div class="container">

<div class="logo-area">
   <img id="copyright-img" class="yuvarlatiyoz" src="copyright1.png" width="158" height="137" style="cursor: pointer;" onclick="degistir()">


<br>

<style>
 .yuvarlatiyoz {
     border-radius: 50%;
 
     transition: transform 0.5s ease-out; 
 }

 .yuvarlatiyoz:hover {
 
     animation: dondurLo 2s linear infinite;
 }

@keyframes dondurLo {
  0%   { transform: rotate(0deg)   translate(0px, 0px); }
  20%  { transform: rotate(72deg)  translate(-3px, 2px); }
  40%  { transform: rotate(144deg) translate(3px, -1px); }
  60%  { transform: rotate(216deg) translate(-2px, -2px); }
  80%  { transform: rotate(288deg) translate(2px, 3px); }
  100% { transform: rotate(360deg) translate(0px, 0px); }
}
</style>




<script>
  let guncelSira = 1;  
  const toplamGorsel = 6; 
  function degistir() { 
    guncelSira++;   
    if (guncelSira > toplamGorsel) {
      guncelSira = 1; 
    } 
    document.getElementById('copyright-img').src = 'copyright' + guncelSira + '.png';
  }
</script>
<br>
</div>

<div class="card-header">
<img src="ihg.png" width="534" height="46"> </img><br><br><br>Site İçi  Arama Sonuçları
</div>
<div id="results"></div>
<div id="noResults" style="display:none;">Arama sonucu bulunamadı.</div>
</div>

<script src="arama-verisi.js"></script>
<script>
function getQueryParam(name) {
const urlParams = new URLSearchParams(window.location.search);
return urlParams.get(name) || "";
}
function temizle(str) {
return str
.toLowerCase()
.replace(/ı/g, 'i').replace(/ş/g, 's').replace(/ğ/g, 'g')
.replace(/ç/g, 'c').replace(/ö/g, 'o').replace(/ü/g, 'u');
}
function renderResults(query) {
const resultsEl = document.getElementById("results");
const noResultsEl = document.getElementById("noResults");
resultsEl.innerHTML = "";
if (!query || !query.trim()) {
noResultsEl.textContent = "Aramak istediğiniz kelime için anasayfaya dönün";
noResultsEl.style.display = "block";
return;
}
if (typeof sitePages === 'undefined') {
noResultsEl.textContent = "Hata: 'arama-verisi.js' dosyası bulunamadı veya yüklenemedi.";
noResultsEl.style.display = "block";
return;
}
const q = temizle(query.trim());
let matchedCount = 0;
sitePages.forEach(page => {
const titleClean = temizle(page.title);
const textClean = temizle(page.text);
if (titleClean.includes(q) || textClean.includes(q)) {
matchedCount++;
let snippet = "İçerik eşleşmesi bulundu.";
const index = textClean.indexOf(q);
if (index !== -1) {
const start = Math.max(0, index - 40);
const end = Math.min(page.text.length, index + q.length + 60);
snippet = "..." + page.text.substring(start, end).replace(/\s+/g, ' ').trim() + "...";
}
const item = document.createElement('div');
item.className = 'result';
item.innerHTML = `
<a href="${page.url}">${page.title}</a>
<div class="snippet">${snippet}</div>
`;
resultsEl.appendChild(item);
}
});
if (matchedCount === 0) {
noResultsEl.textContent = `Arama sonucunuz "${query}" bulunamadı.`;
noResultsEl.style.display = "block";
} else {
noResultsEl.style.display = "none";
}
}
const queryFromUrl = getQueryParam('q');
renderResults(queryFromUrl);
</script>

</body>
